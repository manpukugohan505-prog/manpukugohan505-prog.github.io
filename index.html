<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6ec">
<title>ねこの街づくり</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one-screen app. Header (fish count) / scrolling main / bottom tab bar.
   Palette: warm paper, fish-orange accent, mint for progress, grass for the town. */
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
  --bg:#fdf6ec; --card:#ffffff; --ink:#3b2f2f; --muted:#85766a; --line:#eadfce;
  --accent:#e8793a; --accent-ink:#ffffff; --mint:#6fc7a6; --gold:#f2b632;
  --grass:#b9e0a0; --grass2:#a2d28a; --plot:rgba(255,255,255,.45); --plot-built:rgba(255,255,255,.92);
  --veil:rgba(40,26,14,.45); --shadow:0 2px 0 rgba(120,90,60,.12),0 8px 20px rgba(120,90,60,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1e1a2c; --card:#2a2540; --ink:#f4eef8; --muted:#aaa1bd; --line:#3d3659;
    --accent:#ff9150; --accent-ink:#2a1a0e; --mint:#6fc7a6; --gold:#f5c14a;
    --grass:#4b7a55; --grass2:#41694a; --plot:rgba(255,255,255,.12); --plot-built:rgba(255,255,255,.88);
    --veil:rgba(0,0,0,.6); --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1a2c; --card:#2a2540; --ink:#f4eef8; --muted:#aaa1bd; --line:#3d3659;
  --accent:#ff9150; --accent-ink:#2a1a0e; --mint:#6fc7a6; --gold:#f5c14a;
  --grass:#4b7a55; --grass2:#41694a; --plot:rgba(255,255,255,.12); --plot-built:rgba(255,255,255,.88);
  --veil:rgba(0,0,0,.6); --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  overscroll-behavior:none}
body{font-size:15px;line-height:1.5}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;
  display:flex;gap:6px;align-items:center;box-shadow:var(--shadow);font-variant-numeric:tabular-nums;white-space:nowrap}
.title{flex:1;text-align:center;font-weight:900;letter-spacing:.06em;font-size:1.05rem;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.15rem;cursor:pointer;flex:none}
.iconbtn[disabled]{opacity:.35;cursor:default}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 14px}
.screen{display:none}.screen.on{display:block}
nav{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-top:2px solid var(--line)}
nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px 0;font-weight:800;color:var(--muted);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-height:54px;font-size:.78rem}
nav button .e{font-size:1.35rem;line-height:1.3}
nav button.on{background:var(--accent);color:var(--accent-ink)}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:900;font-size:1rem;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer;min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
.sub{color:var(--muted);font-size:.82rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* puzzle */
.lvbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.lvbar .mid{text-align:center;min-width:0}
.lvbar b{font-size:1.3rem}
.stars{letter-spacing:2px;color:var(--gold);min-height:1.4em}
#board{position:relative;width:min(100%,400px);aspect-ratio:1;margin:0 auto;background:var(--line);border-radius:18px;overflow:hidden;touch-action:manipulation}
.tile{position:absolute;border:0;padding:0;border-radius:10px;background-repeat:no-repeat;cursor:pointer;
  transition:left .13s ease,top .13s ease,width .3s,height .3s,border-radius .3s;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile .no{position:absolute;left:4px;top:3px;min-width:1.35em;height:1.35em;line-height:1.35em;border-radius:999px;
  background:rgba(255,255,255,.85);color:#3b2f2f;font-weight:900;font-size:.72rem;text-align:center}
.tile.hint{outline:4px solid var(--gold);outline-offset:-4px;animation:pulse .5s ease infinite alternate;z-index:2}
#board.won .tile{box-shadow:none;border-radius:0;transition:none}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.info{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px 8px;gap:8px}
.info b{font-variant-numeric:tabular-nums;font-size:1.2rem}
.acts{display:flex;gap:10px}
.acts .btn{flex:1;padding:10px 8px;font-size:.92rem}

/* town */
.townhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px}
.townname{font-weight:900;font-size:1.2rem}
#ground{margin-top:12px;border-radius:22px;padding:10px;background:linear-gradient(var(--grass),var(--grass2));border:2px solid var(--line);box-shadow:var(--shadow)}
#plots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.plot{aspect-ratio:1;border-radius:14px;border:2px dashed rgba(0,0,0,.2);background:var(--plot);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:1.7rem;line-height:1.1;position:relative;cursor:pointer;padding:0;color:#3b2f2f}
.plot.locked{background:rgba(0,0,0,.16);border-style:solid;border-color:rgba(0,0,0,.08);font-size:1rem;color:#fff}
.plot.built{border-style:solid;border-color:rgba(255,255,255,.95);background:var(--plot-built)}
.plot .lv{position:absolute;top:2px;left:5px;font-size:.62rem;font-weight:900;color:#b8651f}
.plot img.res{position:absolute;right:-3px;bottom:-3px;width:46%;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.plot small{font-size:.62rem;font-weight:800}
.plot .plus{font-size:1.5rem;font-weight:900;opacity:.55}

/* dex */
#dexgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center;cursor:pointer;min-width:0}
.dcard img{width:100%;border-radius:12px;display:block;background:var(--line)}
.dcard b{display:block;font-size:.85rem;margin-top:4px;overflow-wrap:anywhere}
.dcard .sub{font-size:.68rem}

/* sheet */
#veil{position:fixed;inset:0;background:var(--veil);display:none;align-items:flex-end;justify-content:center;z-index:10}
#veil.on{display:flex}
#sheet{width:min(100%,480px);max-height:90%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 8px;font-size:1.25rem;text-align:center}
#sheet p{margin:6px 0}
#sheet .stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.big{display:block;width:min(70%,240px);margin:6px auto;border-radius:20px;border:3px solid var(--line)}
.center{text-align:center}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);
  border-radius:16px;padding:10px 12px;cursor:pointer;min-height:56px}
.rowbtn.off{opacity:.5}
.rowbtn .re{font-size:1.8rem}
.rowbtn .rt{flex:1;min-width:0}
.rowbtn .rt b{display:block}
.rowbtn .rt small{color:var(--muted)}
.rowbtn .rc{font-weight:900;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tg{display:flex;justify-content:space-between;align-items:center}
.sw{min-width:64px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){
  .tile{transition:none}.tile.hint{animation:none}#sheet,.pop{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill" aria-label="もっているおさかな">🐟 <span id="fishn">0</span></div>
    <div class="title">ねこの街づくり</div>
    <button class="iconbtn" id="gear" aria-label="せってい">⚙️</button>
  </header>
  <main>
    <section class="screen on" id="s-puzzle">
      <div class="lvbar">
        <button class="iconbtn" id="prev" aria-label="前のステージ">◀</button>
        <div class="mid"><b id="lvname">ステージ 1</b><div class="stars" id="lvstars"></div></div>
        <button class="iconbtn" id="next" aria-label="次のステージ">▶</button>
      </div>
      <div id="board" role="group" aria-label="パズルの盤面"></div>
      <div class="info"><span>手数 <b id="mv">0</b></span><span class="sub" id="goal"></span></div>
      <div class="acts">
        <button class="btn alt" id="hint">💡 ヒント 🐟5</button>
        <button class="btn alt" id="redo">🔀 やり直し</button>
      </div>
      <p class="sub center" style="margin-top:12px">タイルをタップして、ねこの絵を完成させよう。<br>空きマスと同じ列の タイルも まとめて動くよ。</p>
    </section>

    <section class="screen" id="s-town">
      <div class="townhead">
        <div><div class="townname" id="tname"></div><div class="sub" id="tsub"></div></div>
        <div class="pill" id="tinc"></div>
      </div>
      <button class="btn wide" id="collect">🐟 あつめる</button>
      <div class="sub center" style="margin-top:6px">おさかなは 最大6時間ぶん たまるよ</div>
      <div id="ground"><div id="plots"></div></div>
    </section>

    <section class="screen" id="s-dex">
      <div class="townhead"><div><div class="townname">ねこずかん</div><div class="sub" id="dsub"></div></div></div>
      <div id="dexgrid"></div>
    </section>
  </main>
  <nav>
    <button id="t-puzzle" class="on"><span class="e">🧩</span>パズル</button>
    <button id="t-town"><span class="e">🏘️</span>まち</button>
    <button id="t-dex"><span class="e">📖</span>ずかん</button>
  </nav>
</div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

  return s+'</svg>';
}

var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,t0,d,type,vol){
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),st=a.currentTime+(t0||0);
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(vol||.14,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+d);
  o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d+.03);
}

/* ================= PUZZLE ================= */
var P={n:3,k:10,level:1,tiles:[],path:[],moves:0,won:false,els:{},pic:'',cat:null,hintT:null,blankEl:null};
var board=$('board');

function lvParams(L){
  if(L<=8)return {n:3,k:8+2*L};
  if(L<=16)return {n:3,k:24+(L-8)*2};
  if(L<=30)return {n:4,k:24+(L-16)*3};
  if(L<=50)return {n:4,k:66+(L-30)*2};
  return {n:5,k:60+(L-50)*2};
}
function starsFor(m,k){return m<=Math.ceil(k*1.5)+4?3:(m<=k*3+8?2:1)}
function nb(i){
  var n=P.n,x=i%n,y=(i/n)|0,r=[];
  if(x>0)r.push(i-1);if(x<n-1)r.push(i+1);if(y>0)r.push(i-n);if(y<n-1)r.push(i+n);
  return r;
}
function isSolved(){
  var t=P.tiles,N=t.length;
  for(var i=0;i<N-1;i++)if(t[i]!==i+1)return false;
  return t[N-1]===0;
}
function scramble(){
  var n=P.n,N=n*n;
  do{
    P.tiles=[];for(var i=1;i<N;i++)P.tiles.push(i);P.tiles.push(0);
    var b=N-1,prev=-1;P.path=[b];
    for(var k=0;k<P.k;k++){
      var opts=nb(b).filter(function(q){return q!==prev});
      var nx=opts[rnd(opts.length)];
      P.tiles[b]=P.tiles[nx];P.tiles[nx]=0;prev=b;b=nx;P.path.push(b);
    }
  }while(isSolved());
  P.moves=0;P.won=false;
}
function buildBoard(){
  board.innerHTML='';board.classList.remove('won');P.els={};
  var n=P.n,N=n*n;
  for(var v=1;v<=N;v++){
    var b=document.createElement('button');
    b.className='tile';
    var h=v-1,tx=h%n,ty=(h/n)|0;
    b.style.backgroundImage='url("'+P.pic+'")';
    b.style.backgroundSize=(n*100)+'% '+(n*100)+'%';
    b.style.backgroundPosition=(tx/(n-1)*100)+'% '+(ty/(n-1)*100)+'%';
    b.setAttribute('aria-label',v+'番のタイル');
    if(S.set.nums){var s=document.createElement('span');s.className='no';s.textContent=v;b.appendChild(s)}
    if(v===N){b.style.display='none';b.disabled=true;P.blankEl=b}
    else b.addEventListener('click',(function(val){return function(){tap(val)}})(v));
    board.appendChild(b);P.els[v]=b;
  }
}
function place(){
  var n=P.n,size=100/n,gap=3;
  for(var i=0;i<P.tiles.length;i++){
    var v=P.tiles[i];if(!v)continue;
    var e=P.els[v],x=i%n,y=(i/n)|0;
    e.style.width='calc('+size+'% - '+(gap*2)+'px)';
    e.style.height='calc('+size+'% - '+(gap*2)+'px)';
    e.style.left='calc('+(x*size)+'% + '+gap+'px)';
    e.style.top='calc('+(y*size)+'% + '+gap+'px)';
  }
}
function pathUpdate(t){
  var p=P.path;
  if(p.length>=2&&p[p.length-2]===t)p.pop();else p.push(t);
}
function clearHint(){
  clearTimeout(P.hintT);
  var h=board.querySelector('.hint');if(h)h.classList.remove('hint');
}
function tap(v){
  if(P.won)return;
  var n=P.n,i=P.tiles.indexOf(v),b=P.tiles.indexOf(0);
  var sameRow=((i/n)|0)===((b/n)|0),sameCol=i%n===b%n;
  if(!sameRow&&!sameCol){sfx('err');return}
  clearHint();
  var d=sameRow?(i>b?1:-1):(i>b?n:-n);
  while(b!==i){
    var nx=b+d;
    P.tiles[b]=P.tiles[nx];P.tiles[nx]=0;
    pathUpdate(nx);b=nx;
  }
  P.moves++;
  $('mv').textContent=P.moves;
  sfx('move');place();
  if(isSolved())win();
}
function hint(){
  if(P.won)return;
  if(S.fish<5){sfx('err');toast('おさかなが たりないよ');return}
  var p=P.path;if(p.length<2)return;
  var cell=p[p.length-2],v=P.tiles[cell];
  if(!v)return;
  S.fish-=5;save();renderFish();sfx('tap');
  clearHint();
  P.els[v].classList.add('hint');
  P.hintT=setTimeout(clearHint,3000);
}
function renderPuzzleHead(){
  var L=P.level,st=S.stars[L]||0;
  $('lvname').textContent='ステージ '+L;
  $('lvstars').textContent=st?('★'.repeat(st)+'☆'.repeat(3-st)):'☆☆☆';
  $('prev').disabled=L<=1;
  $('next').disabled=L>=S.maxLevel;
  $('mv').textContent=P.moves;
  $('goal').textContent=P.n+'×'+P.n+'・★3は '+(Math.ceil(P.k*1.5)+4)+'手いない';
}
function startLevel(L){
  L=Math.max(1,Math.min(L,Math.min(S.maxLevel,MAXL)));
  clearHint();
  var q=lvParams(L);
  P.level=L;P.n=q.n;P.k=q.k;S.level=L;
  P.cat=CATS[(L-1)%CATS.length];
  P.pic=uri(catSVG(P.cat,{scene:SCENES[(L-1)%SCENES.length]}));
  scramble();buildBoard();place();renderPuzzleHead();save();
}
function win(){
  P.won=true;clearHint();
  var st=starsFor(P.moves,P.k),first=!(S.stars[P.level]>0);
  var reward=Math.round((8+st*4+(P.n-3)*8+Math.floor(P.level/4))*(first?1:.5));
  S.stars[P.level]=Math.max(S.stars[P.level]||0,st);
  S.fish+=reward;S.clears++;
  var unlockedNext=false;
  if(P.level===S.maxLevel&&S.maxLevel<MAXL){S.maxLevel++;unlockedNext=true}
  save();renderFish();renderPuzzleHead();
  // show the finished picture
  P.blankEl.style.display='block';P.blankEl.disabled=true;
  board.classList.add('won');
  var n=P.n,size=100/n;
  Object.keys(P.els).forEach(function(v){
    var e=P.els[v],h=v-1,x=h%n,y=(h/n)|0;
    e.style.width=size+'%';e.style.height=size+'%';
    e.style.left=(x*size)+'%';e.style.top=(y*size)+'%';
    var no=e.querySelector('.no');if(no)no.remove();
  });
  sfx('clear');
  setTimeout(function(){sfx('meow')},500);
  var last=P.level>=MAXL;
  setTimeout(function(){
    openSheet('<div class="center pop"><h2>クリア!</h2>'+
      '<img class="big" alt="'+P.cat.n+'" src="'+uri(catSVG(P.cat,{scene:SCENES[(P.level-1)%SCENES.length]}))+'">'+
      '<p style="font-size:1.6rem;color:var(--gold);letter-spacing:4px;margin:4px 0">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</p>'+
      '<p><b>'+P.cat.n+'</b> が よろこんでいる。</p>'+
      '<p style="font-size:1.2rem"><b>+'+reward+' 🐟</b> <span class="sub">('+P.moves+'手'+(first?'':'・2回目いこうは半分')+')</span></p></div>'+
      '<div class="stack">'+
      (last?'<p class="center sub">ぜんぶのステージを クリアしました! おめでとう!</p>':'<button class="btn" data-act="nextlv">つぎのステージ ▶</button>')+
      '<button class="btn alt" data-act="gotown">🏘️ まちを そだてる</button></div>',true);
    ACT.nextlv=function(){closeSheet();startLevel(P.level+1)};
    ACT.gotown=function(){closeSheet();switchTab('town')};
  },900);
}

$('hint').addEventListener('click',hint);
$('redo').addEventListener('click',function(){sfx('tap');startLevel(P.level)});
$('prev').addEventListener('click',function(){sfx('tap');startLevel(P.level-1)});

function incPerHour(){var s=0;for(var k in S.plots){var p=S.plots[k];s+=B[p.b].inc*p.lv}return s}
function pendF(){var inc=incPerHour();var h=(Date.now()-S.last)/36e5;return Math.min(S.stock+inc*h,inc*6)}
function settle(){S.stock=pendF();S.last=Date.now()}
function builtCount(){return Object.keys(S.plots).length}
function townName(){
  var n=builtCount();
  return n<1?'ひなたの空き地':n<4?'ひなた村':n<9?'ひなたの町':n<15?'ひなた市':'ひなたの都';
}
function catCount(){var c=0;for(var k in S.cats)if(S.cats[k]>0)c++;return c}
function isUnl(i){return S.unl.indexOf(i)>=0}
function unlockCost(){return 25+15*(S.unl.length-9)}
function upCost(p){return Math.round(B[p.b].cost*(p.lv===1?1.5:3))}

function renderTown(){
  $('tname').textContent=townName();
  $('tsub').textContent='たてもの '+builtCount()+'・ねこ '+catCount()+'/'+CATS.length+'ひき';
  $('tinc').textContent='毎時 +'+incPerHour()+' 🐟';

function openBuild(i){
  var h='<h2>なにを たてる?</h2><div class="sub center">たてると ねこが ひっこしてくるよ</div><div class="list">';

  });

}
ACT.build=function(t){
  var i=+t.getAttribute('data-i'),k=t.getAttribute('data-k'),d=B[k];
  if(S.plots[i])return;
  if(S.fish<d.cost){sfx('err');toast('おさかなが たりないよ');return}
  settle();
  S.fish-=d.cost;
  var r=pickCat();
  S.plots[i]={b:k,lv:1,cat:r.id};
  S.cats[r.id]=(S.cats[r.id]||0)+1;
  var bonus=0;
  if(!r.isNew){bonus=10;S.fish+=bonus}
  save();renderFish();renderTown();sfx('build');
  setTimeout(function(){sfx('meow')},350);
  var c=CATS[r.id];
  openSheet('<div class="center pop"><h2>'+(r.isNew?'あたらしい なかま!':'また きてくれた!')+'</h2>'+
    '<img class="big" alt="'+c.n+'" src="'+catURI(r.id)+'">'+
    '<p style="font-size:1.15rem"><b>'+c.n+'</b> <span class="sub">('+RAR[c.r]+')</span></p>'+
    '<p class="sub">'+c.t+'</p>'+
    (bonus?'<p>おみやげ <b>+'+bonus+' 🐟</b></p>':'')+
    '</div><div class="stack"><button class="btn" data-act="close">やったね</button></div>');
};
function pickCat(){
  var missing=CATS.filter(function(c){return !S.cats[c.id]});
  if(!missing.length)return {id:rnd(CATS.length),isNew:false};
  var roll=Math.random()*100,want=roll<70?0:(roll<95?1:2);
  var pool=missing.filter(function(c){return c.r===want});
  if(!pool.length)pool=missing;
  return {id:pool[rnd(pool.length)].id,isNew:true};
}
function openInfo(i){
  var p=S.plots[i],d=B[p.b],c=CATS[p.cat];
  var up=p.lv<3,cost=up?upCost(p):0;
  openSheet('<div class="center"><div style="font-size:3rem;line-height:1.2">'+d.e+'</div><h2>'+d.n+' <span class="sub">Lv'+p.lv+'</span></h2>'+

    '<img src="'+catURI(p.cat)+'" alt="" style="width:72px;border-radius:50%;border:3px solid var(--line)">'+

    '<button class="btn alt" data-act="close">とじる</button></div>');
}

function openUnlock(i){

  if(name==='dex')renderDex();
  document.querySelector('main').scrollTop=0;
}
function updateCollect(){
  var p=Math.floor(pendF());
  $('collect').textContent=p>0?'🐟 +'+p+' あつめる':'🐟 あつめる(まだ ためている)';
}
['puzzle','town','dex'].forEach(function(k){$('t-'+k).addEventListener('click',function(){sfx('tap');switchTab(k)})});

/* ================= settings ================= */
var resetArmed=false;
function openSettings(){
  resetArmed=false;
  var s=S.set;
  function row(label,key){return '<div class="tg"><span>'+label+'</span><button class="btn alt sw" data-act="tgl" data-k="'+key+'">'+(s[key]?'ON':'OFF')+'</button></div>'}
  openSheet('<h2>せってい</h2><div class="stack">'+
    row('🔊 こうかおん','sfx')+row('🎵 BGM','bgm')+row('🔢 タイルの数字','nums')+
    '<p class="sub">きろくは この端末の中だけに ほぞんされます。個人の情報は あつめません。</p>'+
    '<button class="btn alt" data-act="reset" id="rst">データを ぜんぶ けす</button>'+
    '<button class="btn" data-act="close">とじる</button></div>');
}
ACT.tgl=function(t){
  var k=t.getAttribute('data-k');S.set[k]=!S.set[k];save();
  if(k==='bgm'){ac();bgm()}
  if(k==='nums'){buildBoard();place()}
  sfx('tap');openSettings();
};
ACT.reset=function(t){
  if(!resetArmed){resetArmed=true;t.textContent='もう一度 おすと ぜんぶ きえます';t.style.borderColor='var(--accent)';return}
  S=def();save();closeSheet();bgm();renderFish();startLevel(1);switchTab('puzzle');toast('はじめから あそべるよ');
};
$('gear').addEventListener('click',function(){ac();sfx('tap');openSettings()});

/* ================= boot ================= */
function dailyBonus(){
  var t=today();
  if(S.daily.date===t)return false;
  var streak=S.daily.date===yesterday()?S.daily.streak+1:1;
  var bonus=10+Math.min(streak,7)*5;
  S.daily={date:t,streak:streak};S.fish+=bonus;save();renderFish();
  openSheet('<div class="center pop"><h2>ログインボーナス</h2><div style="font-size:3rem">🎁</div>'+
    '<p><b>'+streak+'日れんぞく</b> ログイン中!</p><p style="font-size:1.3rem"><b>+'+bonus+' 🐟</b></p>'+
    '<p class="sub">まいにち 来ると ふえるよ(7日めまで)</p></div>'+
    '<div class="stack"><button class="btn" data-act="close">もらう</button></div>');
  return true;
}
function welcome(){
  S.seen=true;save();
  openSheet('<div class="center pop"><h2>ようこそ!</h2><img class="big" alt="" src="'+catURI(0)+'">'+
    '<p>パズルを とくと <b>おさかな🐟</b> がもらえるよ。</p>'+
    '<p>おさかなで <b>まちに たてもの</b> を つくると、<br>ねこが ひっこしてくるよ。</p>'+
    '<p class="sub">たてものは おさかなを じどうで ふやしてくれる。</p></div>'+
    '<div class="stack"><button class="btn" data-act="start">はじめる</button></div>',true);
  ACT.start=function(){closeSheet();dailyBonus()};
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&tab==='town')renderTown()});
document.addEventListener('pointerdown',function(){if(S.set.bgm&&!bgmT){ac();bgm()}},{once:true});

renderFish();
startLevel(Math.min(S.level||1,S.maxLevel));
if(!S.seen)welcome();else dailyBonus();

try{
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}catch(e){}
})();
</script>
</body>
</html>
